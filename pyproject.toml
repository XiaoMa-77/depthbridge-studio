[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "depthbridge-studio"
version = "0.1.0"
description = "Local RGB-D calibration workbench for pixel-to-robot coordinate inspection"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["numpy>=1.26,<3", "Pillow>=10,<14", "opencv-python-headless>=4.10,<5", "fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.optional-dependencies]
realsense = ["pyrealsense2>=2.55,<3"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.9", "build>=1", "playwright>=1.49"]

[project.scripts]
depthbridge = "depthbridge.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
depthbridge = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
