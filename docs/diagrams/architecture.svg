<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="One local workbench. Four explicit layers.">
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#8797c1" stroke-width="1.2"/></marker></defs>
<rect width="1200" height="470" rx="18" fill="#f5f5f2"/>
<g font-family="Arial, sans-serif"><text x="36" y="40" font-size="12" fill="#3555e8" letter-spacing="2">DEPTHBRIDGE / ENGINEERING NOTES</text>
<text x="36" y="83" font-size="30" font-weight="600" fill="#1d2028">One local workbench. Four explicit layers.</text>
<text x="36" y="111" font-size="15" fill="#6b7180">RealSense acquisition, geometric state and browser interaction stay on the same computer.</text>
<rect x="36" y="155" width="246" height="152" rx="12" fill="white" stroke="#dce2ee"/>
<text x="54" y="183" font-size="11" letter-spacing="1.3" fill="#25304a" opacity=".65">01 / INPUT</text>
<text x="54" y="214" font-size="19" font-weight="600" fill="#25304a">RGB-D sources</text>
<text x="54" y="243" font-size="13" fill="#25304a" opacity=".8">D435 via RealSense SDK</text>
<text x="54" y="266" font-size="13" fill="#25304a" opacity=".8">Aligned frame ZIP / explicit demo</text>
<text x="54" y="289" font-size="13" fill="#25304a" opacity=".8">RGB + depth + intrinsics + XYZ</text>
<rect x="330" y="155" width="246" height="152" rx="12" fill="#3555e8" stroke="#3555e8"/>
<text x="348" y="183" font-size="11" letter-spacing="1.3" fill="white" opacity=".65">02 / COMPUTE</text>
<text x="348" y="214" font-size="19" font-weight="600" fill="white">Python workspace</text>
<text x="348" y="243" font-size="13" fill="white" opacity=".8">Frame cache + source sessions</text>
<text x="348" y="266" font-size="13" fill="white" opacity=".8">Sampling / rigid fit / hand-eye</text>
<text x="348" y="289" font-size="13" fill="white" opacity=".8">Held-out error statistics</text>
<rect x="624" y="155" width="246" height="152" rx="12" fill="white" stroke="#dce2ee"/>
<text x="642" y="183" font-size="11" letter-spacing="1.3" fill="#25304a" opacity=".65">03 / TRANSPORT</text>
<text x="642" y="214" font-size="19" font-weight="600" fill="#25304a">FastAPI on loopback</text>
<text x="642" y="243" font-size="13" fill="#25304a" opacity=".8">HTTP request / response</text>
<text x="642" y="266" font-size="13" fill="#25304a" opacity=".8">PNG + JSON / typed operations</text>
<text x="642" y="289" font-size="13" fill="#25304a" opacity=".8">127.0.0.1:8765</text>
<rect x="918" y="155" width="246" height="152" rx="12" fill="white" stroke="#dce2ee"/>
<text x="936" y="183" font-size="11" letter-spacing="1.3" fill="#25304a" opacity=".65">04 / INTERACTION</text>
<text x="936" y="214" font-size="19" font-weight="600" fill="#25304a">Offline browser UI</text>
<text x="936" y="243" font-size="13" fill="#25304a" opacity=".8">RGB-D canvas + 3D cloud</text>
<text x="936" y="266" font-size="13" fill="#25304a" opacity=".8">Point inspector + fit + validation</text>
<text x="936" y="289" font-size="13" fill="#25304a" opacity=".8">Local fonts / bounded motion</text>
<path d="M285 232L322 232" stroke="#8797c1" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<path d="M579 232L616 232" stroke="#8797c1" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<path d="M873 232L910 232" stroke="#8797c1" stroke-width="1.5" marker-end="url(#arrow)" fill="none"/>
<text x="36" y="361" font-size="14" fill="#667591">EXPORTS   JSON session / transform  ·  CSV measurements  ·  RGB-D ZIP  ·  camera-frame PLY</text>
<text x="36" y="397" font-size="14" fill="#667591">Runtime state is in memory. Save a session and its RGB-D frame separately to reproduce a measurement.</text>
<text x="36" y="432" font-size="14" fill="#667591">No CDN, cloud inference or robot motion commands. The camera SDK is an optional local dependency.</text>
</g></svg>